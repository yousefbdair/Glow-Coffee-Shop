<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Coffee - order</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

</head>
<body>
    <h1 class="s-header">(order page)</h1>
    <nav>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">products</a></li>
        <li><a href="order.html">order</a></li>
        <li><a href="media.html">media</a></li>
    </ul>
</nav>
    <hr>
    <!-- order form -->
     <form>
        <p>enter your data ...</p>
        <br>
        <div>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required>
        </div>
        <br>
        <div>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required>
        </div>
        <br>
        <div>
            <label for="phone">phone:</label><br>
            <input type="tel" id="phone" name="phone">
        </div>
        <br>
        <div>
            <label for="date">Delivery Date:</label><br>
            <input type="date" id="date" name="date">
        </div>
        <br>
        <div>
            <label>Coffee Size:</label><br>
            
            <input type="radio" id="small" name="size" value="Small">
            <label for="small">Small</label><br>

            <input type="radio" id="medium" name="size" value="Medium">
            <label for="medium">Medium</label><br>

            <input type="radio" id="large" name="size" value="Large">
            <label for="large">Large</label>
        </div>
        <br>
        <div>
            <label>Add-ons:</label><br>
            
            <input type="checkbox" id="extra" name="addon" value="Extra Shot">
            <label for="extra">Extra Shot</label><br>

            <input type="checkbox" id="caramel" name="addon" value="Caramel">
            <label for="caramel">Caramel</label><br>

            <input type="checkbox" id="vanilla" name="addon" value="Vanilla">
            <label for="vanilla">Vanilla</label>
        </div>
        <br>
        <div>
            <label for="coffee-product">Select Coffee Product:</label><br>
            <select id="coffee-product" name="coffee_product">
                <option value="cappuccino">Cappuccino</option>
                <option value="latte">Latte</option>
                <option value="americano">Americano</option>
            </select>
        </div>
        <br>
        <div>
            <label for="notes">Special Notes:</label><br>
            <textarea id="notes" name="notes" rows="4" cols="30" maxlength="200" placeholder="Write any special instructions here (max 200 characters)..."></textarea>
        </div>
        <br>
        <div>
            <label for="receipt">Upload Payment Receipt (JPG/PNG):</label><br>
            <input type="file" id="receipt" name="receipt" accept=".jpg, .png">
        </div>
        <br>
        <div>
            <button type="submit">Place Order</button>
            <button type="reset">Clear Form</button>
        </div>
     </form>
</body>
</html>
